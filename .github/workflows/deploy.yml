name: Deploy Telegram Bot to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: telegram-bot
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # allows pushing to ghcr.io

    steps:
      # ── Checkout 
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Login to GitHub Container Registry 
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      # ── Build & push image to GHCR 
      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${{ env.REGISTRY }}/${{ secrets.GHCR_USERNAME }}/${{ env.IMAGE_NAME }}
          docker build \
            -t $IMAGE_TAG:${{ github.sha }} \
            -t $IMAGE_TAG:latest \
            ./bot
          docker push $IMAGE_TAG:${{ github.sha }}
          docker push $IMAGE_TAG:latest

      # ── Azure login 
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Register GHCR credentials with Container App 
      - name: Set GHCR registry credentials
        run: |
          az containerapp registry set \
            --name ${{ secrets.APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --server ghcr.io \
            --username ${{ secrets.GHCR_USERNAME }} \
            --password ${{ secrets.GHCR_TOKEN }}

      # ── Deploy new image
      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ secrets.APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ secrets.GHCR_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --min-replicas 0 \
            --max-replicas 3 \
            --set-env-vars \
              BOT_TOKEN=secretref:bot-token \
              WEBHOOK_SECRET=secretref:webhook-secret \
              WEBHOOK_URL=${{ secrets.WEBHOOK_URL }}

      # ── Health check 
      - name: Health check
        run: |
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.WEBHOOK_URL }}/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed!"
            exit 1
          fi
          echo "Bot is healthy!"
